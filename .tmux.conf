# Catppuccin Mocha Tmux Configuration

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys on
set -g focus-events on
set -g escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string '#S:#I - #W'
set -g set-clipboard on
# Make the active pane easy to spot.
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

set -g base-index 1
setw -g pane-base-index 1

set-option -g prefix C-a
unbind %

bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Keep new windows and sessions in the active pane's directory.
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

bind v copy-mode
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind-key C-b set-option -g status
bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer"
bind-key n command-prompt "new-session -s '%%' -c '#{pane_current_path}'"
bind-key a set-window-option synchronize-panes
bind-key S run-shell '~/.config/tmux/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message 'tmux environment saved'

# Popups start in the current pane's directory.
bind-key g display-popup -E -w 90% -h 80% -d '#{pane_current_path}' lazygit
bind-key t display-popup -E -w 90% -h 80% -d '#{pane_current_path}' 'command -v btop >/dev/null && exec btop || exec top'
bind-key y display-popup -E -w 90% -h 80% -d '#{pane_current_path}' 'command -v yazi >/dev/null && exec yazi || { echo "yazi is not installed"; read; }'
bind-key i display-popup -E -w 90% -h 80% -d '#{pane_current_path}' 'command -v gitui >/dev/null && exec gitui || { echo "gitui is not installed"; read; }'
bind-key N display-popup -E -w 90% -h 80% -d '#{pane_current_path}' nvim

unbind -T copy-mode-vi MouseDragEnd1Pane

set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @sessionx-bind 'o'

# Catppuccin plugin configuration.
set -g @catppuccin_flavor 'mocha'
# Keep the official palette, but use our minimal custom window layout.
set -g @catppuccin_window_status_style 'none'
set -g @catppuccin_status_background '#11111b'

# Catppuccin Mocha theme colors (matches the dark Neovim/terminal palette)
# Mocha's darkest surface (Crust)
catppuccin_bg="#11111b"
catppuccin_fg="#cdd6f4"
catppuccin_accent="#cba6f7"
catppuccin_blue="#89b4fa"
catppuccin_green="#a6e3a1"
catppuccin_red="#f38ba8"
catppuccin_muted="#6c7086"

# Modern status bar at bottom left with rich UI
set -g status-position bottom
set -g status-justify "left"
set -g status-left-length 120
set -g status-right-length 80

set -g status-style "bg=${catppuccin_bg},fg=${catppuccin_fg}"
set -g status-interval 1

set -g status-left "#[fg=${catppuccin_accent},bold]  #S #[fg=${catppuccin_muted}]│"
set -g status-right "#[fg=${catppuccin_blue}]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=${catppuccin_muted}]│ #{?#{e|>=:10,#{battery_percentage}},#[fg=${catppuccin_red}]🔋 #{battery_percentage},#[fg=${catppuccin_green}]🔋 #{battery_percentage}} #[fg=${catppuccin_muted}]│ #{?#{==:#{online_status},ok},#[fg=${catppuccin_green}]🌐 online,#[fg=${catppuccin_red}]🌐 offline} #[fg=${catppuccin_muted}]│ %H:%M %d-%b-%y "

set -g window-status-format "#[bg=${catppuccin_bg},fg=${catppuccin_muted}]  #{window_index}:#[fg=${catppuccin_fg}]#{window_name} "
set -g window-status-style "bg=${catppuccin_bg},fg=${catppuccin_fg}"
set -g window-status-activity-style "bg=${catppuccin_accent},fg=${catppuccin_bg},bold"
set -g window-status-bell-style "bg=${catppuccin_red},fg=${catppuccin_bg},bold"
set -g window-status-separator " #[bg=${catppuccin_bg},fg=${catppuccin_accent}]│ "

set -g window-status-current-format "#[bg=${catppuccin_bg},fg=${catppuccin_accent},bold]  #{window_index}:#{window_name} "
set -g window-status-current-style "bg=${catppuccin_bg},fg=${catppuccin_accent},bold"

set -g window-status-separator ""

set -g @online_icon "ok"
set -g @offline_icon "nok"

set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"
set -g @continuum-save-interval "15"
set -g @continuum-restore "on"

run '~/.config/tmux/.tmux/plugins/tpm/tpm'

# Let agent TUIs receive Ctrl-j instead of tmux using it for pane navigation.
# Keep vim-tmux-navigator behavior elsewhere.
bind-key -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?(claude|codex|pi)$'" "send-keys C-j" "select-pane -D"
