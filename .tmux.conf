# Vesper Tmux Configuration

set -g default-shell "/usr/bin/zsh"
set -g default-command "/usr/bin/zsh -l"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys on
set -g focus-events on
set -g escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string '#S:#I - #W'
set -g set-clipboard on
# Make the active pane easy to spot.
set -g pane-border-style "fg=#282828"
set -g pane-active-border-style "fg=#ffc799"

set -g base-index 1
setw -g pane-base-index 1

set-option -g prefix C-a
unbind %

bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Keep new windows and sessions in the active pane's directory.
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

bind v copy-mode
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind-key C-b set-option -g status
bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer"
bind-key n command-prompt "new-session -s '%%' -c '#{pane_current_path}'"
bind-key a set-window-option synchronize-panes
bind-key S run-shell '~/.config/tmux/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message 'tmux environment saved'

# Popups start in the current pane's directory.
bind-key g display-popup -E -w 90% -h 80% -d '#{pane_current_path}' lazygit
bind-key t display-popup -E -w 90% -h 80% -d '#{pane_current_path}' 'command -v btop >/dev/null && exec btop || exec top'
bind-key y display-popup -E -w 90% -h 80% -d '#{pane_current_path}' 'command -v yazi >/dev/null && exec yazi || { echo "yazi is not installed"; read; }'
bind-key i display-popup -E -w 90% -h 80% -d '#{pane_current_path}' 'command -v gitui >/dev/null && exec gitui || { echo "gitui is not installed"; read; }'
bind-key N display-popup -E -w 90% -h 80% -d '#{pane_current_path}' nvim

unbind -T copy-mode-vi MouseDragEnd1Pane

set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @sessionx-bind 'o'

# Vesper palette (https://github.com/raunofreiberg/vesper).
vesper_bg="#101010"
vesper_fg="#ffffff"
vesper_accent="#ffc799"
vesper_mint="#99ffe4"
vesper_coral="#ff8080"
vesper_muted="#7e7e7e"

# Modern status bar at bottom left with rich UI
set -g status-position bottom
set -g status-justify "left"
set -g status-left-length 120
set -g status-right-length 80

set -g status-style "bg=${vesper_bg},fg=${vesper_fg}"
set -g status-interval 1

set -g status-left "#[fg=${vesper_accent},bold]  #S #[fg=${vesper_muted}]│"
set -g status-right "#[fg=${vesper_fg}]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=${vesper_muted}]│ #{?#{e|>=:10,#{battery_percentage}},#[fg=${vesper_coral}]🔋 #{battery_percentage},#[fg=${vesper_mint}]🔋 #{battery_percentage}} #[fg=${vesper_muted}]│ #{?#{==:#{online_status},ok},#[fg=${vesper_mint}]🌐 online,#[fg=${vesper_coral}]🌐 offline} #[fg=${vesper_muted}]│ %H:%M %d-%b-%y "

set -g window-status-format "#[bg=${vesper_bg},fg=${vesper_muted}]  #{window_index}:#[fg=${vesper_fg}]#{window_name} "
set -g window-status-style "bg=${vesper_bg},fg=${vesper_fg}"
set -g window-status-activity-style "bg=${vesper_accent},fg=${vesper_bg},bold"
set -g window-status-bell-style "bg=${vesper_coral},fg=${vesper_bg},bold"
set -g window-status-separator " #[bg=${vesper_bg},fg=${vesper_accent}]│ "

set -g window-status-current-format "#[bg=${vesper_bg},fg=${vesper_accent},bold]  #{window_index}:#{window_name} "
set -g window-status-current-style "bg=${vesper_bg},fg=${vesper_accent},bold"

set -g window-status-separator ""

set -g @online_icon "ok"
set -g @offline_icon "nok"

set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"
set -g @continuum-save-interval "15"
set -g @continuum-restore "on"

run '~/.config/tmux/.tmux/plugins/tpm/tpm'

# Let agent TUIs receive Ctrl-h/j/k/l instead of tmux using them for pane navigation.
# Keep vim-tmux-navigator behavior elsewhere.
bind-key -n C-h if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?(claude|codex|pi)$'" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?(claude|codex|pi)$'" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?(claude|codex|pi)$'" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?(claude|codex|pi)$'" "send-keys C-l" "select-pane -R"
