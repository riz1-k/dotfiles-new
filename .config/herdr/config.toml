onboarding = false

[terminal]
default_shell = "/usr/bin/zsh"

[theme]
# The terminal's palette, which is the rice theme (~/dotfiles/rice).
name = "terminal"

[ui.toast]
delivery = "herdr"

[ui]
# Keep split panes visually separated instead of sharing divider borders (this is the closest thing to "padding" between panes).
pane_gaps = true
show_agent_labels_on_pane_borders = true

[keys]
prefix = "ctrl+a"
