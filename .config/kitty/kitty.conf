# Font
# font_family Operator Mono Bold
font_family Geist Mono Bold
font_size 10
modify_font cell_height 140%

# Window
window_padding_width 9
hide_window_decorations no
# Required for explicit hsplit/vsplit launch locations to be honored
enabled_layouts splits,stack

# Terminal Behavior
shell /bin/zsh
scrollback_lines 10000
shell_integration no-cursor
allow_remote_control yes
enable_audio_bell no

# Cursor
cursor_shape block
cursor_blink_interval 0

# Mouse
mouse_hide_wait 0

# Visual
background_opacity 1
bold_is_bright yes
cursor_trail 1

# Clipboard
copy_on_select clipboard
clipboard_control write-clipboard read-clipboard write-primary read-primary

# Keybindings
map ctrl+plus change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
# Ctrl+Shift+| (the shifted backslash key) opens a vertical split
map ctrl+shift+backslash launch --cwd=current --location=vsplit
map ctrl+shift+- launch --cwd=current --location=hsplit
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+m toggle_layout stack
map ctrl+shift+r load_config_file
