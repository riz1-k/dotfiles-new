# Font
font_family SF Mono Bold
font_size 10
adjust_line_height 120%

# Window
window_padding_width 9
hide_window_decorations no
enabled_layouts splits,stack


# Terminal Behavior
shell /bin/zsh
scrollback_lines 10000
shell_integration no-cursor

# Cursor
cursor_shape block
cursor_blink_interval 0


# Mouse
mouse_hide_wait 0

# Visual
background_opacity 0.95
bold_is_bright yes

cursor_trail 1

# Clipboard
copy_on_select clipboard
clipboard_control write-clipboard read-clipboard write-primary read-primary

# Keybindings
map ctrl+plus change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+shift+backslash launch --cwd=current --location=vsplit
map ctrl+shift+- launch --cwd=current --location=hsplit
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+m toggle_layout stack
map ctrl+shift+r load_config_file

# Remote control (needed for clipboard monitor)
allow_remote_control yes

enable_audio_bell no



# BEGIN_KITTY_THEME
# Gruvbox Material Light Hard
include current-theme.conf
# END_KITTY_THEME
