# Colours: the rice theme (~/dotfiles/rice); `rice theme set` reloads every window.
include ~/.local/state/rice/current/theme/kitty.conf

# Font — MonoLisa, Black weight everywhere (no italic, no separate bold cut).
font_family      family="MonoLisa" style="Black"
bold_font        family="MonoLisa" style="Black"
italic_font      family="MonoLisa" style="Black"
bold_italic_font family="MonoLisa" style="Black"
font_size 10
modify_font cell_height 125%
modify_font underline_position 2
modify_font underline_thickness 150%
# Slightly crisper glyphs than kitty's Linux default (1.0 0)
text_composition_strategy 1.2 10
# Ligatures, but not under the cursor so you can still edit e.g. "->"
disable_ligatures cursor
undercurl_style thick-sparse

# Window
window_padding_width 7
hide_window_decorations yes
window_border_width 1.5pt
draw_minimal_borders yes
inactive_text_alpha 0.85
# Required for explicit hsplit/vsplit launch locations to be honored
enabled_layouts splits,stack

# Terminal Behavior
shell /bin/zsh
scrollback_lines 10000
shell_integration no-cursor
allow_remote_control yes
enable_audio_bell no

# Cursor
cursor_shape block
cursor_blink_interval 0

# Mouse
mouse_hide_wait 0

# Visual
background_opacity 1
cursor_trail 0

# Tab bar (colors come from the rice theme)
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index} {title.split('/')[-1]}"
active_tab_font_style bold
inactive_tab_font_style normal

# Clipboard
copy_on_select clipboard
clipboard_control write-clipboard read-clipboard write-primary read-primary

# Keybindings
map ctrl+plus change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
# Ctrl+Shift+| (the shifted backslash key) opens a vertical split
map ctrl+shift+backslash launch --cwd=current --location=vsplit
map ctrl+shift+- launch --cwd=current --location=hsplit
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+m toggle_layout stack
map ctrl+shift+r load_config_file
