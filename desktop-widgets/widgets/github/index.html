<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GitHub</title>
  <link rel="stylesheet" href="./rice.css">
  <link rel="stylesheet" href="./rice-theme.css">
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="card">
    <!-- Every list gets all its rows, then rows come off the longest list until the card fits. -->
    <section class="github">
      <header class="part-head">
        <svg class="gh-mark" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span class="title">GitHub</span>
        <span class="account-picker">
          <select id="account" aria-label="Switch GitHub CLI account" title="Switch the active GitHub CLI account" disabled>
            <option value="">Loading…</option>
          </select>
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
        </span>
        <a class="notifications mono" id="notifications" data-url="https://github.com/notifications" title="Waiting on your review, and unread @mentions">
          <svg viewBox="0 0 24 24"><path d="M6 16.5V10a6 6 0 0 1 12 0v6.5l1.5 1.5h-15zM10 20.5a2 2 0 0 0 4 0"/></svg>
          <span id="notification-count">–</span>
        </a>
      </header>
      <div class="gh-error small" id="gh-error" role="alert" hidden></div>
      <div class="empty muted small" id="account-status" role="status" hidden></div>
      <div class="gh-body" id="gh-body"><div class="empty muted">Loading…</div></div>
    </section>
  </main>
  <script type="module" src="./widget.js"></script>
</body>
</html>
