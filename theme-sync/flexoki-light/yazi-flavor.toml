# Flexoki Light (https://stephango.com/flexoki) — generated from the Vesper file by theme-sync/gen/remap.py
# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#bc5215" }

# Find
find_keyword  = { fg = "#ad8301", bold = true, italic = true, underline = true }
find_position = { fg = "#a02f6f", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#24837b", bg = "#24837b" }
marker_cut      = { fg = "#af3029", bg = "#af3029" }
marker_marked   = { fg = "#24837b", bg = "#24837b" }
marker_selected = { fg = "#ad8301", bg = "#ad8301" }

# Count
count_copied   = { fg = "#fffcf0", bg = "#24837b" }
count_cut      = { fg = "#fffcf0", bg = "#af3029" }
count_selected = { fg = "#fffcf0", bg = "#ad8301" }

# Border
border_symbol = "│"
border_style  = { fg = "#dad8ce" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#fffcf0", bg = "#bc5215", bold = true }
inactive = { fg = "#6f6e69", bg = "#f2f0e5" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#fffcf0", bg = "#bc5215", bold = true }
normal_alt  = { fg = "#bc5215", bg = "#e6e4d9" }

# Select mode
select_main = { fg = "#fffcf0", bg = "#24837b", bold = true }
select_alt  = { fg = "#24837b", bg = "#e6e4d9" }

# Unset mode
unset_main = { fg = "#fffcf0", bg = "#ad8301", bold = true }
unset_alt  = { fg = "#ad8301", bg = "#e6e4d9" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#6f6e69" }
perm_type  = { fg = "#bc5215" }
perm_read  = { fg = "#ad8301" }
perm_write = { fg = "#af3029" }
perm_exec  = { fg = "#24837b" }

# Progress
progress_label  = { fg = "#100f0f", bold = true }
progress_normal = { fg = "#24837b", bg = "#e6e4d9" }
progress_error  = { fg = "#ad8301", bg = "#af3029" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#bc5215" }
active   = { fg = "#a02f6f", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#bc5215" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#bc5215" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#bc5215" }
title   = {}
hovered = { fg = "#a02f6f", bold = true }

# : }}}


# : Which {{{

[which]
border          = { fg = "#bc5215" }
cand            = { fg = "#24837b" }
rest            = { fg = "#b7b5ac" }
desc            = { fg = "#a02f6f" }
separator       = "  "
separator_style = { fg = "#6f6e69" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#24837b" }
run     = { fg = "#a02f6f" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#fffcf0", bg = "#100f0f" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#bc5215" }
title    = { fg = "#bc5215" }
tbl_col  = { fg = "#24837b" }
tbl_cell = { fg = "#a02f6f", bg = "#e6e4d9" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#24837b" }
title_warn  = { fg = "#ad8301" }
title_error = { fg = "#af3029" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "**/image/*", fg = "#24837b" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#ad8301" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a02f6f" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#24837b" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#b7b5ac" },
	# Fallback
	{ url = "*", fg = "#100f0f" },
	{ url = "*/", fg = "#bc5215" },
]

# : }}}

[icon]

conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#100f0f" },
	{ if = "link", text = "", fg = "#6f6e69" },
	{ if = "block", text = "", fg = "#ad8301" },
	{ if = "char", text = "", fg = "#ad8301" },
	{ if = "fifo", text = "", fg = "#ad8301" },
	{ if = "sock", text = "", fg = "#ad8301" },
	{ if = "sticky", text = "", fg = "#ad8301" },
	{ if = "dummy", text = "", fg = "#af3029" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#bc5215" },
	{ if = "dir", text = "", fg = "#bc5215" },
	{ if = "exec", text = "", fg = "#24837b" },
	{ if = "!dir", text = "", fg = "#100f0f" },
]
