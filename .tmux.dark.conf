# Catppuccin Macchiato palette.
catppuccin_bg="#24273a"
catppuccin_fg="#cad3f5"
catppuccin_accent="#c6a0f6"
catppuccin_blue="#8aadf4"
catppuccin_green="#a6da95"
catppuccin_red="#ed8796"
catppuccin_muted="#6e738d"

set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#c6a0f6"
set -g status-style "bg=${catppuccin_bg},fg=${catppuccin_fg}"
set -g status-left "#[fg=${catppuccin_accent},bold]  #S #[fg=${catppuccin_muted}]│"
set -g status-right "#[fg=${catppuccin_blue}]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=${catppuccin_muted}]│ #{?#{e|>=:10,#{battery_percentage}},#[fg=${catppuccin_red}]🔋 #{battery_percentage},#[fg=${catppuccin_green}]🔋 #{battery_percentage}} #[fg=${catppuccin_muted}]│ #{?#{==:#{online_status},ok},#[fg=${catppuccin_green}]🌐 online,#[fg=${catppuccin_red}]🌐 offline} #[fg=${catppuccin_muted}]│ %H:%M %d-%b-%y "
set -g window-status-format "#[bg=${catppuccin_bg},fg=${catppuccin_muted}]  #{window_index}:#[fg=${catppuccin_fg}]#{window_name} "
set -g window-status-style "bg=${catppuccin_bg},fg=${catppuccin_fg}"
set -g window-status-activity-style "bg=${catppuccin_accent},fg=${catppuccin_bg},bold"
set -g window-status-bell-style "bg=${catppuccin_red},fg=${catppuccin_bg},bold"
set -g window-status-current-format "#[bg=${catppuccin_bg},fg=${catppuccin_accent},bold]  #{window_index}:#{window_name} "
set -g window-status-current-style "bg=${catppuccin_bg},fg=${catppuccin_accent},bold"
