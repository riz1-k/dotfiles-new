# Sample (rice template, from theme-sync's Vesper file)
# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#5fa8d3" }

# Find
find_keyword  = { fg = "#e5c07b", bold = true, italic = true, underline = true }
find_position = { fg = "#d3a2e3", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#8cc085", bg = "#8cc085" }
marker_cut      = { fg = "#e06c6c", bg = "#e06c6c" }
marker_marked   = { fg = "#8cc085", bg = "#8cc085" }
marker_selected = { fg = "#e5c07b", bg = "#e5c07b" }

# Count
count_copied   = { fg = "#1b1d22", bg = "#8cc085" }
count_cut      = { fg = "#1b1d22", bg = "#e06c6c" }
count_selected = { fg = "#1b1d22", bg = "#e5c07b" }

# Border
border_symbol = "│"
border_style  = { fg = "#353739" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#1b1d22", bg = "#5fa8d3", bold = true }
inactive = { fg = "#5c6370", bg = "#24262a" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#1b1d22", bg = "#5fa8d3", bold = true }
normal_alt  = { fg = "#5fa8d3", bg = "#5fa8d3" }

# Select mode
select_main = { fg = "#1b1d22", bg = "#8cc085", bold = true }
select_alt  = { fg = "#8cc085", bg = "#5fa8d3" }

# Unset mode
unset_main = { fg = "#1b1d22", bg = "#e5c07b", bold = true }
unset_alt  = { fg = "#e5c07b", bg = "#5fa8d3" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#5c6370" }
perm_type  = { fg = "#5fa8d3" }
perm_read  = { fg = "#e5c07b" }
perm_write = { fg = "#e06c6c" }
perm_exec  = { fg = "#8cc085" }

# Progress
progress_label  = { fg = "#d8d4c6", bold = true }
progress_normal = { fg = "#8cc085", bg = "#5fa8d3" }
progress_error  = { fg = "#e5c07b", bg = "#e06c6c" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#5fa8d3" }
active   = { fg = "#d3a2e3", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#5fa8d3" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#5fa8d3" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#5fa8d3" }
title   = {}
hovered = { fg = "#d3a2e3", bold = true }

# : }}}


# : Which {{{

[which]
border          = { fg = "#5fa8d3" }
cand            = { fg = "#8cc085" }
rest            = { fg = "#636360" }
desc            = { fg = "#d3a2e3" }
separator       = "  "
separator_style = { fg = "#5c6370" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#8cc085" }
run     = { fg = "#d3a2e3" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#1b1d22", bg = "#d8d4c6" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#5fa8d3" }
title    = { fg = "#5fa8d3" }
tbl_col  = { fg = "#8cc085" }
tbl_cell = { fg = "#d3a2e3", bg = "#5fa8d3" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#8cc085" }
title_warn  = { fg = "#e5c07b" }
title_error = { fg = "#e06c6c" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "**/image/*", fg = "#8cc085" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#e5c07b" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d3a2e3" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#8cc085" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#636360" },
	# Fallback
	{ url = "*", fg = "#d8d4c6" },
	{ url = "*/", fg = "#5fa8d3" },
]

# : }}}

[icon]

conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#d8d4c6" },
	{ if = "link", text = "", fg = "#5c6370" },
	{ if = "block", text = "", fg = "#e5c07b" },
	{ if = "char", text = "", fg = "#e5c07b" },
	{ if = "fifo", text = "", fg = "#e5c07b" },
	{ if = "sock", text = "", fg = "#e5c07b" },
	{ if = "sticky", text = "", fg = "#e5c07b" },
	{ if = "dummy", text = "", fg = "#e06c6c" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#5fa8d3" },
	{ if = "dir", text = "", fg = "#5fa8d3" },
	{ if = "exec", text = "", fg = "#8cc085" },
	{ if = "!dir", text = "", fg = "#d8d4c6" },
]
