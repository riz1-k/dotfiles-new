# Vesper (https://github.com/raunofreiberg/vesper): peppermint and orange on near-black.
# The ui_* keys pin rice's desktop roles to what theme-sync used, so the desktop
# looks exactly as before. Other themes derive them (see docs/themes.md).
mode = "dark"

accent = "#ffc799"
selection = "#232323"
selection_background = "#988049"
selection_foreground = "#b9beb8"
muted = "#7e7e7e"

background = "#101010"
dark_background = "#0b0b0b"
darker_background = "#070707"
lighter_background = "#161616"

foreground = "#ffffff"
dark_foreground = "#a0a0a0"
light_foreground = "#d4d4d4"
bright_foreground = "#ffffff"

red = "#f5a191"
yellow = "#e6b99d"
orange = "#ffc799"
green = "#90b99f"
cyan = "#ea83a5"
blue = "#aca1cf"
magenta = "#e29eca"
brown = "#8a6a55"

bright_red = "#ff8080"
bright_yellow = "#ffc799"
bright_green = "#99ffe4"
bright_cyan = "#f591b2"
bright_blue = "#b9aeda"
bright_magenta = "#ecaad6"

# Vesper's ANSI white is grey; the text colour is pure white.
color7 = "#a0a0a0"

ui_surface = "#161616"
ui_surface_alt = "#232323"
ui_border = "#282828"
ui_dim = "#a0a0a0"
ui_faint = "#505050"
